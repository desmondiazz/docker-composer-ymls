version: "3"
services:
  kafka-controller-1:
    image: bitnami/kafka:latest
    container_name: kafka-controller-1
    ports:
      - 9092:9092
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker
      - KAFKA_CFG_LISTENERS=CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=contoller1:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=contoller1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=2@kafka-broker-2:9093,3@kafka-broker-2:9094
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-controller-1-data:/bitnami/kafka
    networks:
      - kafka-net

  kafka-broker-1:
    image: bitnami/kafka:latest
    container_name: kafka-broker-1
    ports:
      - 9093:9093
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker-1:9093
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-controller-1:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=contoller1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-broker-1-data:/bitnami/kafka
    networks:
      - kafka-net

  kafka-broker-2:
    image: bitnami/kafka:latest
    container_name: kafka-broker-2
    ports:
      - 9094:9094
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker-2:9094
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-controller-1:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=contoller1
      - KAFKA_CFG_CONTROLLER_LISTENER_SECURITY_PROTOCOL_MAP=contoller1:PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-broker-2-data:/bitnami/kafka
    networks:
      - kafka-net

volumes:
  kafka-controller-1-data:
  kafka-broker-1-data:
  kafka-broker-2-data:

networks:
  kafka-net:
    driver: bridge